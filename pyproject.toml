[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Multimodal RAG chatbot with LangGraph orchestration"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "openai>=1.0",
    "sqlalchemy>=2.0",
    "faiss-cpu>=1.7",
    "numpy>=1.24",
    "streamlit>=1.28",
    "pydantic>=2.0",
    "python-multipart>=0.0.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
    "fitz>=0.0.1.dev2",
    "pypdfium2>=4.0",
    "pytesseract>=0.3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pillow>=10.0",
    "opencv-python>=4.8",
    "puremagic>=1.15",
    "passlib>=1.7",
    "bcrypt>=4.0",
    "python-jose>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

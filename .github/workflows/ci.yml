name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  PYTHON_VERSION: "3.12"
  DEFAULT_BRANCH: "multimodal-rag"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML types-requests

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy
        run: mypy . --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1-mesa-glx libglib2.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docker:
    if: github.ref == format('refs/heads/{0}', env.DEFAULT_BRANCH)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: agentic-rag-backend:latest

      - name: Build model-server image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile.model_server
          push: false
          tags: agentic-rag-model-server:latest
